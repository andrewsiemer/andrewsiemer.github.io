<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Andrew Siemer — Signature</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400&display=swap">

  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }
    body {
      padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .copy-btn {
      font: inherit;
      font-size: 13px;
      padding: 8px 16px;
      background: #756445;
      color: #f4f2ea;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .copy-btn:active { opacity: 0.8; }
    .copy-status {
      display: inline-block;
      margin-left: 12px;
      font-size: 12px;
      color: #756445;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .copy-status.show { opacity: 1; }
    .controls { margin-bottom: 32px; }
  </style>
</head>
<body>

<div class="controls">
  <button class="copy-btn" id="copyBtn">Copy signature</button>
  <span class="copy-status" id="copyStatus">Copied to clipboard</span>
</div>

<table id="signature" cellpadding="0" cellspacing="0" border="0" role="presentation"
       style="font-family: 'Crimson Pro', 'Hoefler Text', Georgia, serif; font-weight: 400; color: #756445;">
  <tr>
    <td style="vertical-align: middle; padding-right: 16px;">
      <img src="/static/images/brand/crest-outlined-dark-small.png"
           alt="Siemer crest" width="71" height="54"
           style="display:block; width:71px; height:54px;">
    </td>
    <td style="vertical-align: middle; border-left: 1px solid rgba(117,100,69,0.25); padding-left: 16px;">
      <div style="font-family: 'Crimson Pro', 'Hoefler Text', Georgia, serif; font-weight: 400; font-size: 20px; letter-spacing: 0.02em; color: #756445;">Andrew Siemer</div>
    </td>
  </tr>
</table>

<script>
(function () {
  const btn = document.getElementById('copyBtn');
  const status = document.getElementById('copyStatus');
  const sig = document.getElementById('signature');

  btn.addEventListener('click', async () => {
    const html = sig.outerHTML;
    const text = sig.innerText;
    let ok = false;
    try {
      await navigator.clipboard.write([
        new ClipboardItem({
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([text], { type: 'text/plain' })
        })
      ]);
      ok = true;
    } catch (e) {
      // Fallback: select and execCommand for older browsers / iOS quirks.
      const range = document.createRange();
      range.selectNodeContents(sig);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      try { ok = document.execCommand('copy'); } catch (e2) {}
      sel.removeAllRanges();
    }
    status.textContent = ok ? 'Copied to clipboard' : 'Copy failed — long-press the signature to copy';
    status.classList.add('show');
    setTimeout(() => status.classList.remove('show'), 2000);
  });
})();
</script>

</body>
</html>
